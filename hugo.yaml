baseURL: "https://ysedurepo.github.io/"
title: youssadi
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Youssef Saadi
  description: "Youssef Saadi — Associate Professor at Sultan Moulay Slimane University, Beni Mellal, Morocco. Artificial Intelligence and Computer Vision."
  keywords: [Youssef Saadi, Artificial Intelligence, Computer Vision, Machine Learning, Sultan Moulay Slimane University, Beni Mellal, Morocco]
  author: Youssef Saadi
  images: ["/images/profil_saadi.jpeg"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    favicon: "<link / abs url>"
    favicon16x16: "<link / abs url>"
    favicon32x32: "<link / abs url>"
    apple_touch_icon: "<link / abs url>"
    safari_pinned_tab: "<link / abs url>"

  label:
    text: "Youssef Saadi"

  profileMode:
    enabled: false
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "Youssef Saadi"
    Content: |
      <img src="/images/profil_saadi.jpeg" alt="Youssef Saadi" width="150" height="150"
           style="float:left;width:150px;height:150px;border-radius:50%;object-fit:cover;margin:0.25rem 1.5rem 1rem 0;" />

      I am an **Associate Professor** at **Sultan Moulay Slimane University** in Beni Mellal,
      Morocco, where I teach and carry out research in **Artificial Intelligence** and
      **Computer Vision**.

      This site is where I write about the things I work on — machine learning, deep learning,
      and the practical side of building models that behave the way we expect them to.

      - 📄 [Read my CV](/cv/)
      - 🎓 [Google Scholar](https://scholar.google.com/citations?user=unRNz4QAAAAJ&hl=en) · [ResearchGate](https://www.researchgate.net/profile/Youssef-Saadi) · [ORCID](https://orcid.org/0000-0002-1351-3935)
      - 💼 [LinkedIn](https://www.linkedin.com/in/youssef-saadi-84927817) · [Personal site](https://sites.google.com/view/ysaadi/home)
      - ✉️ [y.saadi@usms.ma](mailto:y.saadi@usms.ma)
      - ☎️ [+212 661 438 421](tel:+212661438421)
      - 📍 Sultan Moulay Slimane University, Beni Mellal, Morocco

      <div style="clear:both;"></div>

  socialIcons:
    - name: email
      url: "mailto:y.saadi@usms.ma"
    - name: phone
      url: "tel:+212661438421"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=unRNz4QAAAAJ&hl=en"
    - name: researchgate
      url: "https://www.researchgate.net/profile/Youssef-Saadi"
    - name: orcid
      url: "https://orcid.org/0000-0002-1351-3935"
    - name: linkedin
      url: "https://www.linkedin.com/in/youssef-saadi-84927817"
    - name: cv
      title: "Personal site"
      url: "https://sites.google.com/view/ysaadi/home"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  editPost:
    URL: "https://github.com/<path_to_repo>/content"
    Text: "Suggest Changes"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: categories
      name: categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20
    - identifier: cv
      name: cv
      url: /cv/
      weight: 5

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      # required so the raw <img> in params.homeInfoParams.Content is not stripped
      unsafe: true
    passthrough:
      delimiters:
        block:
          - - $$
            - $$
        inline:
          - - $
            - $
    
    
  
